version: 2

# Python dependencies only: there is no workflow here for a github-actions
# entry to watch, and Dependabot fails that job outright when it finds none.
# A major is left to its own pull request: a breaking bump must not hold back
# the routine ones.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # requirements.txt states the MINIMUM each library must be, not the newest
    # one released. Raise that floor only when something actually needs it,
    # rather than every month, which would exclude whatever a distribution
    # ships for no reason.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
